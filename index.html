<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#11140c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5ede4" media="(prefers-color-scheme: light)" />
    <title>NoEmprendasSolo</title>
    <!-- Pinta el tema ANTES de que monte React: sin esto se ve un flash oscuro
         al cargar en claro. Debe quedar en sync con src/lib/theme.ts. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("nes-theme")
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light" : "dark"
          }
          if (t === "light") document.documentElement.setAttribute("data-theme", "light")
        } catch (e) { /* sin localStorage: se queda en oscuro */ }
      })()
    </script>
    <!-- Google Identity Services — necesario para OAuth de Google Calendar -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
